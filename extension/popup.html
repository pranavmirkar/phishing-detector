<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">

    <!-- Auth banner (shown when signed out) -->
    <div class="auth-banner" id="auth-banner">
      <svg class="auth-google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
        <path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      <span class="auth-banner-text">Sign in to sync your scan history</span>
      <button class="auth-signin-btn" id="auth-signin-btn">Sign in</button>
    </div>

    <!-- Auth user row (shown when signed in) -->
    <div class="auth-user-row" id="auth-user-row" style="display:none">
      <img class="auth-avatar" id="auth-avatar" src="" alt="" />
      <div class="auth-user-info">
        <p class="auth-user-name" id="auth-user-name">—</p>
        <p class="auth-user-email" id="auth-user-email">—</p>
      </div>
      <button class="auth-signout-btn" id="auth-signout-btn">Sign out</button>
    </div>

    <!-- Header -->
    <div class="pop-header">
      <svg class="pop-icon" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L4 6v6c0 5.25 3.75 10.15 8 11.35C16.25 22.15 20 17.25 20 12V6L12 2z"
          fill="#6366f1" fill-opacity=".15" stroke="#6366f1" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M9 12l2 2 4-4" stroke="#6366f1" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <p class="pop-title">PhishGuard</p>
        <p class="pop-sub">Gmail Threat Monitor</p>
      </div>
      <div class="toggle-wrap">
        <label class="toggle">
          <input type="checkbox" id="toggle-enabled" checked />
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <!-- Last scan -->
    <div class="pop-section" id="last-scan-section">
      <p class="section-label">Last Scanned</p>
      <div id="last-scan-empty" class="empty-msg">
        Open Gmail and hover over a sender to see results here.
      </div>
      <div id="last-scan-result" style="display:none">
        <div class="scan-domain-row">
          <code class="scan-domain" id="scan-domain">—</code>
          <span class="scan-badge" id="scan-badge">—</span>
        </div>
        <div id="scan-warnings" class="scan-warnings"></div>
        <div class="scan-meta" id="scan-meta"></div>
      </div>
    </div>

    <!-- Quick check -->
    <div class="pop-section">
      <p class="section-label">Quick Check</p>
      <div class="quick-check">
        <input type="text" class="quick-input" id="quick-input" placeholder="any@domain.com" />
        <button class="quick-btn" id="quick-btn">Check</button>
      </div>
      <div id="quick-result" style="margin-top:10px;display:none"></div>
    </div>

    <!-- Footer -->
    <div class="pop-footer">
      <a href="http://localhost:3000" target="_blank" class="footer-link">Open Dashboard ↗</a>
    </div>

  </div>
  <script src="domains.js"></script>
  <script src="levenshtein.js"></script>
  <script src="popup.js"></script>
</body>
</html>
